name: Test versions

# Build and smoke-test several upstream versions without releasing anything.
# Run manually, e.g. before backfilling or rebuilding releases of older
# versions, or after a change to the build that may affect old sources.
on:
  workflow_dispatch:
    inputs:
      versions:
        description: Space-separated versions to test. Leave empty for every version from 0.9.2 up to THRIFT_VERSION.
        required: false
        default: ""

permissions:
  contents: read

# An explicit "bash" adds -o pipefail; the implicit default is only "bash -e",
# so a failing command piped into tee would not fail the step.
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    runs-on: ubuntu-24.04
    outputs:
      json: ${{ steps.list.outputs.json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        env:
          INPUT_VERSIONS: ${{ inputs.versions }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$INPUT_VERSIONS" ]; then
            json=$(tr -s '[:space:]' '\n' <<<"$INPUT_VERSIONS" | jq -R . | jq -cs 'map(select(length > 0))')
          else
            json=$(scripts/list-versions.sh)
          fi
          echo "$json"
          echo "json=$json" >> "$GITHUB_OUTPUT"

  build:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.json) }}
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ matrix.version }}
